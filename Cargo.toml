[package]
name = "japonais"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kana"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
eframe = "0.37.0"
egui_extras = { version = "0.37.0", features = ["svg"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
ttf-parser = "0.25.1"
